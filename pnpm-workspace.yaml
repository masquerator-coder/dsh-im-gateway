# Single-package workspace: this project is NOT a monorepo. Peer deps
# (@deepseek-ai/*) are provided by the host DSH runtime at load time and must
# not be auto-installed from the npm registry (they are not all published
# there). Only the local devDependencies (esbuild + types) are installed.
packages: []
# Install-time scripts, reviewed and allowed:
#   esbuild    — `node install.js` fetches the platform binary the build needs.
#   protobufjs — transitive via @larksuiteoapi/node-sdk; `node scripts/postinstall`
#                only prints a version-scheme warning.
# Left as the literal string "set this to true or false", these were not
# booleans, so pnpm ignored both and every install exited non-zero with
# ERR_PNPM_IGNORED_BUILDS even though the install itself succeeded.
allowBuilds:
  esbuild: true
  protobufjs: true
autoInstallPeers: false
minimumReleaseAgeExclude:
  - '@deepseek-ai/cordis-plugin-group@1.0.4'
  - '@deepseek-ai/cordis-plugin-include@1.0.9'
  - '@deepseek-ai/cordis-plugin-loader@1.0.6-alpha.1'
  - '@deepseek-ai/cosmokit@1.8.5'
  - '@deepseek-ai/dsh-agent-default-model@0.2.1-alpha.1'
  - '@deepseek-ai/dsh-agent@0.2.1-alpha.1'
  - '@deepseek-ai/dsh-api-remotes@0.2.1-alpha.1'
  - '@deepseek-ai/dsh-app-boot@0.2.1-alpha.1'
  - '@deepseek-ai/dsh-atomic-write@0.2.1-alpha.1'
  - '@deepseek-ai/dsh-brand@0.2.1-alpha.1'
  - '@deepseek-ai/dsh-client-locale@0.2.1-alpha.1'
  - '@deepseek-ai/dsh-client-ui-plugin-manager@0.2.1-alpha.1'
  - '@deepseek-ai/dsh-client-ui-settings@0.2.1-alpha.1'
  - '@deepseek-ai/dsh-client-ui-slots@0.2.1-alpha.1'
