# Single-package workspace: this project is NOT a monorepo. Peer deps
# (@deepseek-ai/*) are provided by the host DSH runtime at load time and must
# not be auto-installed from the npm registry (they are not all published
# there). Only the local devDependencies (esbuild + types) are installed.
packages: []
allowBuilds:
  esbuild: set this to true or false
  protobufjs: set this to true or false
autoInstallPeers: false
minimumReleaseAgeExclude:
  - '@deepseek-ai/cordis-plugin-group@1.0.4'
  - '@deepseek-ai/cordis-plugin-include@1.0.9'
  - '@deepseek-ai/cordis-plugin-loader@1.0.5'
  - '@deepseek-ai/cosmokit@1.8.5'
  - '@deepseek-ai/dsh-agent-default-model@0.1.7-alpha.2'
  - '@deepseek-ai/dsh-agent@0.1.7-alpha.2'
  - '@deepseek-ai/dsh-api-remotes@0.1.7-alpha.2'
  - '@deepseek-ai/dsh-app-boot@0.1.7-alpha.2'
  - '@deepseek-ai/dsh-atomic-write@0.1.7-alpha.2'
  - '@deepseek-ai/dsh-brand@0.1.7-alpha.2'
  - '@deepseek-ai/dsh-client-locale@0.1.7-alpha.2'
  - '@deepseek-ai/dsh-client-ui-plugin-manager@0.1.7-alpha.2'
  - '@deepseek-ai/dsh-client-ui-settings@0.1.7-alpha.2'
  - '@deepseek-ai/dsh-client-ui-slots@0.1.7-alpha.2'
  - '@deepseek-ai/dsh-config-editor@0.1.7-alpha.2'
  - '@deepseek-ai/dsh-deque@0.1.7-alpha.2'
  - '@deepseek-ai/dsh-home-paths@0.1.7-alpha.2'
  - '@deepseek-ai/dsh-invariants@0.1.7-alpha.2'
  - '@deepseek-ai/dsh-launch-environment@0.1.7-alpha.2'
  - '@deepseek-ai/dsh-llm@0.1.7-alpha.2'
  - '@deepseek-ai/dsh-package-manifest@0.1.7-alpha.2'
