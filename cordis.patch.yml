# dsh-im-gateway bundle patch — the configuration layer this package
# contributes when a profile lists it as a bundle.
#
# The plugin row references the package by name (not a source path), so Node
# resolution loads the built entry `lib/index.js` (see package.json `main`).
# Users override any row here from their profile's own cordis.patch.yml.

- insert:
    - id: im-gateway
      name: 'dsh-im-gateway'
      config:
        host: '127.0.0.1'
        port: 8799
        inboundPath: '/im'
        secret: ''
        chatIdField: 'chat_id'
        textField: 'text'
        senderField: 'sender_id'
        callbackUrl: 'http://127.0.0.1:9999/reply'
        callbackChatHeader: 'x-im-chat-id'
        callbackSecretHeader: 'x-im-secret'
        provider: ''
        model: ''
        maxTokens: 0
        agentPreset: ''
        cwd: ''
        disposeAfterReply: false
        # VOLATILE channel settings (DSH 0.1.7+). Both fields are edited from
        # this plugin's own page on the Plugins page; the framework writes edits
        # straight into the running references without remounting the plugin, so
        # editing them never bounces a live channel connection.
        #   channelsCwd — plugin-wide default working directory (a channel's own
        #                 `cwd` always wins; empty = fall back to `cwd` above,
        #                 then ~/.dsh/im-workspace).
        #   channels    — the configured channels, in display order.
        channelsCwd: ''
        channels: []
